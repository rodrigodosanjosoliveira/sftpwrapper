name: SftpWrapper CI/CD

on:
  push:
    branches: [ "master" ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --no-restore --configuration Release

    - name: Run unit tests
      run: dotnet test --no-build --configuration Release --verbosity normal

    - name: Pack NuGet package
      run: dotnet pack SftpWrapper.Sdk/SftpWrapper.Sdk.csproj --no-build --configuration Release -o out

    - name: NuGet login via OIDC (Trusted Publishing)
      if: startsWith(github.ref, 'refs/tags/v')
      id: login
      uses: NuGet/login@v1
      with:
        user: rodrigodosanjosoliveira

    - name: Publish NuGet package on release tag
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        dotnet nuget push out/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
